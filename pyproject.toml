[project]
name = "ugc-moderation-agent"
version = "0.1.0"
description = "Multimodal UGC moderation agent — Strands Agents + AgentCore (Rekognition / Nova Pro / Guardrails / Memory / Code Interpreter)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Hugo Xiao" }]

dependencies = [
    "strands-agents>=1.0.0",
    "bedrock-agentcore>=0.1.0",
    "bedrock-agentcore-starter-toolkit>=0.1.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ugc_moderation"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "policies_scripts"]
asyncio_mode = "auto"
